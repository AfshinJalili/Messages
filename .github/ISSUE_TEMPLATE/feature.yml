name: Feature
description: New behavior
labels: [feature, needs-triage]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What the user can do afterwards
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      value: |
        - [ ] 
        - [ ] Works in LTR and RTL/Persian
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Emulator evidence
      description: Instrumented classes that must pass and screenshots to capture
