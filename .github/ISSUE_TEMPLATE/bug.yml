name: Bug
description: Something is broken
labels: [bug, needs-triage]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Build and device
      description: Build variant, Android version, locale, font scale
  - type: textarea
    id: evidence
    attributes:
      label: Emulator evidence
      description: Instrumented classes that must pass and screenshots that prove the fix
