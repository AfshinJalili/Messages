name: Bug
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Build and device
      description: Build variant, Android version, locale, font scale
