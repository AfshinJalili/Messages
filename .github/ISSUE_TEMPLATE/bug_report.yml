name: Bug report
description: Report a problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Describe what happened and how to reproduce it.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Steps to reproduce, expected behavior, and actual behavior.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 1.8.0
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: true
