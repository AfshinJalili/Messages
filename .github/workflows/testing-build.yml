name: Testing build

on:
  # Any base, so every PR in a stack gets its own run.
  pull_request:
  push:
    branches: [main, redesign-groundwork]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The debug APK publish lives in apk.yml. Two parallel jobs:
# - fast-checks: host checks and the icon export check on every run (they read DESIGN.md),
#   plus JVM unit tests unless the change is docs-only. About two minutes.
# - emulator: builds debug + androidTest once, then tools/verify.sh runs host checks and
#   instrumentation without rebuilding. Skipped for docs-only changes.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/path-filters.yml
          predicate-quantifier: every

  fast-checks:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Host checks
        run: |
          failed=()
          for check in tests/check_*.py; do
            echo "::group::$check"
            python3 "$check" || failed+=("$check")
            echo "::endgroup::"
          done
          python3 tools/export_icon.py --check || failed+=(export_icon)
          [ ${#failed[@]} -eq 0 ] || { echo "::error::Failed: ${failed[*]}"; exit 1; }

      - uses: actions/setup-java@v6
        if: needs.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        if: needs.changes.outputs.code == 'true'
        with:
          cache-read-only: false

      - name: Unit tests
        if: needs.changes.outputs.code == 'true'
        run: ./gradlew :app:testDebugUnitTest --stacktrace

  emulator:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Write cache on PRs and redesign-groundwork so re-runs and the integration branch stay warm.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-google_apis-x86_64-pixel_7

      # Unit tests run in fast-checks; VERIFY_SKIP_BUILD=1 below skips them here.
      - name: Build app and tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."

      - name: Host checks, emulator tests and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: API=35 VERIFY_SKIP_BUILD=1 bash tools/verify.sh

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-qa
          path: .scratch/qa/
          retention-days: 14
          if-no-files-found: warn
