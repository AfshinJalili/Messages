name: APK

# Pull requests get a debug APK on a pre-release named pr-<number>, linked from a PR comment.
# Every push to main publishes a release APK as a GitHub Release.
# Signing secrets are described under "CI builds" in AGENTS.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

# A closed PR reports the base branch as its ref, so group PR runs by number,
# or the cleanup run cancels the release on main. Releases queue; they never cancel.
concurrency:
  group: apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  pr:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore debug keystore
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: mkdir -p ~/.android && echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # R8 runs only in release builds; catch its failures here rather than on main.
      - name: Check release build
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Name the APK
        run: |
          short=${SHA::7}
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/messages-debug-pr$PR-$short.apk"
          echo "APK=$(ls dist/*.apk)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: messages-debug-pr${{ env.PR }}
          path: ${{ env.APK }}
          retention-days: 14

      - name: Publish pre-release pr-${{ env.PR }}
        run: |
          gh release delete "pr-$PR" --cleanup-tag --yes 2>/dev/null || true
          gh release create "pr-$PR" "$APK" --prerelease --latest=false --target "$SHA" \
            --title "PR #$PR test build" \
            --notes "Debug build of #$PR at $SHA. Replaced on every push and deleted when the PR closes."

      - name: Comment the download link
        run: |
          url="https://github.com/$GH_REPO/releases/download/pr-$PR/$(basename "$APK")"
          body=$(printf '%s\n' "<!-- apk-build -->" \
            "**Test build** for ${SHA::7}: [$(basename "$APK")]($url)" "" \
            "Debug app (\`com.afsh.messages.debug\`). It installs over a local debug build only when \`DEBUG_KEYSTORE_BASE64\` holds the same debug key.")
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- apk-build -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

  pr-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete pre-release pr-${{ github.event.pull_request.number }}
        run: gh release delete "pr-${{ github.event.pull_request.number }}" --cleanup-tag --yes || true

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      AFSH_KEYSTORE_BASE64: ${{ secrets.AFSH_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.AFSH_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.AFSH_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.AFSH_KEY_PASSWORD }}
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Set up signing
        run: |
          if [ -n "$AFSH_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$AFSH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/afsh.jks"
            {
              echo "AFSH_STORE_FILE=$RUNNER_TEMP/afsh.jks"
              echo "AFSH_STORE_PASSWORD=$STORE_PASSWORD"
              echo "AFSH_KEY_ALIAS=$KEY_ALIAS"
              echo "AFSH_KEY_PASSWORD=$KEY_PASSWORD"
              echo "SIGNED_WITH=release"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No AFSH_* signing secrets. The release APK is signed with the debug key."
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              mkdir -p ~/.android && echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            fi
            { echo "AFSH_SIGN_WITH_DEBUG_KEY=true"; echo "SIGNED_WITH=debug"; } >> "$GITHUB_ENV"
          fi

      - name: Version
        run: |
          base=$(sed -n 's/^VERSION_CODE=//p' gradle.properties)
          name=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          code=$((base + GITHUB_RUN_NUMBER))
          { echo "CODE=$code"; echo "NAME=$name"; } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -PVERSION_CODE="$CODE" --stacktrace

      - name: Publish release
        run: |
          mkdir -p dist
          apk="dist/messages-$NAME-$CODE.apk"
          cp app/build/outputs/apk/release/*.apk "$apk"
          flags=()
          notes="Release build of ${GITHUB_SHA::7}, version $NAME ($CODE)."
          if [ "$SIGNED_WITH" = debug ]; then
            flags+=(--prerelease)
            notes="$notes Signed with a debug key: later builds signed with the release key will not install over it."
          fi
          gh release create "v$NAME-$CODE" "$apk" --target "$GITHUB_SHA" \
            --title "Messages $NAME ($CODE)" --notes "$notes" "${flags[@]}"
