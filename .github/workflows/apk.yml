name: APK

# Pull requests get a debug APK on a pre-release named pr-<number>, linked from a PR comment.
# The R8 release check runs in parallel so the debug APK can publish as soon as it is ready.
# Docs-only PRs (see .github/path-filters.yml) skip both builds.
# Pushes to redesign-groundwork seed the Gradle cache for that long-lived branch.
# Main publishes nightlies (release-nightly.yml); official releases are release.yml.
# Signing secrets are described under "CI" in AGENTS.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [redesign-groundwork]

# A closed PR reports the base branch as its ref, so group PR runs by number,
# or the cleanup run would cancel a cache seed on the base branch.
concurrency:
  group: apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  changes:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/path-filters.yml
          predicate-quantifier: every

  pr:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Write cache on PRs so a second push reuses the first; default only writes on main.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Restore debug keystore
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: mkdir -p ~/.android && echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Name the APK
        run: |
          short=${SHA::7}
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/messages-debug-pr$PR-$short.apk"
          echo "APK=$(ls dist/*.apk)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: messages-debug-pr${{ env.PR }}
          path: ${{ env.APK }}
          retention-days: 14

      - name: Publish pre-release pr-${{ env.PR }}
        run: |
          gh release delete "pr-$PR" --cleanup-tag --yes 2>/dev/null || true
          gh release create "pr-$PR" "$APK" --prerelease --latest=false --target "$SHA" \
            --title "PR #$PR test build" \
            --notes "Debug build of #$PR at $SHA. Replaced on every push and deleted when the PR closes."

      - name: Comment the download link
        run: |
          url="https://github.com/$GH_REPO/releases/download/pr-$PR/$(basename "$APK")"
          body=$(printf '%s\n' "<!-- apk-build -->" \
            "**Test build** for ${SHA::7}: [$(basename "$APK")]($url)" "" \
            "Debug app (\`com.afsh.messages.debug\`). It installs over a local debug build only when \`DEBUG_KEYSTORE_BASE64\` holds the same debug key.")
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- apk-build -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

  # R8 runs only in release builds; catch its failures here rather than on main.
  # Parallel with `pr` so the debug APK, pre-release and PR comment are not blocked.
  pr-r8:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Check release build
        run: ./gradlew :app:assembleRelease --stacktrace

  # Seed Gradle User Home cache for the long-lived integration branch (PRs target it often).
  cache-seed:
    if: github.event_name == 'push' && github.ref == 'refs/heads/redesign-groundwork'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Seed Gradle cache
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:testDebugUnitTest --stacktrace

  pr-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete pre-release pr-${{ github.event.pull_request.number }}
        run: gh release delete "pr-${{ github.event.pull_request.number }}" --cleanup-tag --yes || true
