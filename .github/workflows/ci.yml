name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Design tokens
        run: python3 tests/check_design_tokens.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew :app:testCoreDebugUnitTest --stacktrace

      - name: Build debug APK and instrumented test APK
        run: ./gradlew :app:assembleCoreDebug :app:assembleCoreDebugAndroidTest --stacktrace

      # The Room schema JSON is generated by the build and git-ignored.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Inbox database
        run: python3 tests/check_inbox_database.py

      - uses: actions/upload-artifact@v5
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
