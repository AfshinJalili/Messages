name: Build and test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Design tokens
        run: python3 tests/check_design_tokens.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew :app:testCoreDebugUnitTest --stacktrace

      - name: Build debug APK and instrumented test APK
        run: ./gradlew :app:assembleCoreDebug :app:assembleCoreDebugAndroidTest --stacktrace

      # The Room schema JSON is generated by the build and git-ignored.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Inbox database
        run: python3 tests/check_inbox_database.py

      - uses: actions/upload-artifact@v5
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  instrumented:
    # Non-blocking until every class passes on a clean emulator (#100).
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build app and test APKs
        run: ./gradlew :app:assembleFossDebug :app:assembleFossDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/ci_instrumented.sh

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: instrumented-output
          path: instrumented-output.txt
          if-no-files-found: ignore
