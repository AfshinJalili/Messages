[versions]
androidx-window = "1.4.0"
#jetbrains
kotlin = "2.4.20"
kotlinxSerializationJson = "1.11.0"
#KSP
ksp = "2.3.12"
#Detekt
detekt = "1.23.8"
detektCompose = "0.6.8"
#AndroidX
androidx-constraintlayout = "2.2.2"
androidx-swiperefreshlayout = "1.2.0"
androidx-lifecycleprocess = "2.10.0"
androidx-documentfile = "1.1.0"
# Also used by the commons module; declared because Compose pages use BackHandler.
androidx-activity = "1.12.4"
#Eventbus
eventbus = "3.3.1"
#Compose
# Compose 1.12 needs compileSdk 37 or later.
compose-bom = "2026.09.00"
#Room
room = "2.8.5"
#Test
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
#Vendored commons module (pinned to what org.fossify:commons 6.1.6 declared)
kotlin-immutable-collections = "0.4.0"
androidx-customView = "1.2.0"
androidx-customViewPooling = "1.1.0"
androidx-lifecycle = "2.10.0"
androidx-biometricKtx = "1.4.0-alpha02"
androidx-exifinterface = "1.4.2"
androidx-coreKtx = "1.17.0"
androidx-appcompat = "1.7.1"
material = "1.13.0"
patternLockView = "a90b0d4bf0"
reprint = "2cb206415d"
recyclerviewFastscroller = "5a95285b1f"
rtlViewpager = "2.0.2"
commons-compose = "1.7.6"
commons-composeMaterial3 = "1.4.0"
glide = "5.0.5"
glideCompose = "1.0.0-beta08"
gson = "2.13.2"
jodaTime = "2.14.0"
#Fossify
mmslib = "1.0.0"
indicator-fast-scroll = "4524cd0b61"
#Gradle
gradlePlugins-agp = "9.4.1"
#build
app-build-compileSDKVersion = "37"
app-build-targetSDK = "36"
app-build-minimumSDK = "26"
app-build-javaVersion = "VERSION_17"
app-build-kotlinJVMTarget = "17"
#Helpers
ez-vcard = "0.12.2"
[libraries]
#AndroidX
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycleprocess" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidx-swiperefreshlayout" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidx-documentfile" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-window = { module = "androidx.window:window", version.ref = "androidx-window" }
#Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
#Test
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
#Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "detektCompose" }
#Vendored commons module
kotlin-immutable-collections = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlin-immutable-collections" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-biometric-ktx = { module = "androidx.biometric:biometric-ktx", version.ref = "androidx-biometricKtx" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-coreKtx" }
androidx-customView = { module = "androidx.customview:customview", version.ref = "androidx-customView" }
androidx-customViewPooling = { module = "androidx.customview:customview-poolingcontainer", version.ref = "androidx-customViewPooling" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exifinterface" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewModel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewModel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
commons-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "commons-compose" }
commons-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "commons-composeMaterial3" }
commons-compose-material2 = { module = "androidx.compose.material:material", version.ref = "commons-compose" }
commons-compose-material-icons = { module = "androidx.compose.material:material-icons-extended", version.ref = "commons-compose" }
commons-compose-animation = { module = "androidx.compose.animation:animation", version.ref = "commons-compose" }
commons-compose-activity = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
commons-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "commons-compose" }
commons-compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "commons-compose" }
commons-compose-uiTooling-debug = { module = "androidx.compose.ui:ui-tooling", version.ref = "commons-compose" }
commons-compose-uiTooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "commons-compose" }
commons-compose-view-binding = { module = "androidx.compose.ui:ui-viewbinding", version.ref = "commons-compose" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-compose = { module = "com.github.bumptech.glide:compose", version.ref = "glideCompose" }
glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }
material = { module = "com.google.android.material:material", version.ref = "material" }
patternLockView = { module = "com.github.aritraroy:patternLockView", version.ref = "patternLockView" }
reprint = { module = "com.github.tibbi:reprint", version.ref = "reprint" }
recyclerView-fastScroller = { module = "com.github.tibbi:RecyclerView-FastScroller", version.ref = "recyclerviewFastscroller" }
rtl-viewpager = { module = "com.github.naveensingh:rtl-viewpager", version.ref = "rtlViewpager" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
joda-time = { module = "joda-time:joda-time", version.ref = "jodaTime" }
#Fossify
indicator-fast-scroll = { module = "org.fossify:IndicatorFastScroll", version.ref = "indicator-fast-scroll" }
mmslib = { module = "org.fossify:mmslib", version.ref = "mmslib" }
#EventBus
eventbus = { module = "org.greenrobot:eventbus", version.ref = "eventbus" }
#Helpers
ez-vcard = { module = "com.googlecode.ez-vcard:ez-vcard", version.ref = "ez-vcard" }
#Kotlin
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
[bundles]
commons-compose = [
    "commons-compose-activity",
    "commons-compose-animation",
    "commons-compose-foundation",
    "commons-compose-material-icons",
    "commons-compose-material3",
    "commons-compose-runtime",
    "commons-compose-ui",
    "commons-compose-uiTooling-preview",
]
commons-compose-preview = [
    "androidx-customView",
    "androidx-customViewPooling",
    "commons-compose-uiTooling-debug",
]
lifecycle = [
    "androidx-lifecycle-compose",
    "androidx-lifecycle-runtime",
    "androidx-lifecycle-viewModel",
    "androidx-lifecycle-viewModel-compose",
]
room = [
    "androidx-room-ktx",
    "androidx-room-runtime",
]
[plugins]
android = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
library = { id = "com.android.library", version.ref = "gradlePlugins-agp" }
parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
